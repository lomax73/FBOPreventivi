{% extends 'base.html' %}

{% block title %}Elimina sezione — FBOPreventivi{% endblock %}

{% block content %}
<h1>Elimina sezione</h1>
<div class="card">
    <p>
        Eliminare la sezione <strong>{{ object.titolo }}</strong>? Verranno eliminate anche
        tutte le sue voci. L'operazione è definitiva.
    </p>
    <form method="post">
        {% csrf_token %}
        <button class="btn" style="background:#ef4444;" type="submit">Elimina</button>
        <a class="btn btn-secondary" href="{% url 'preventivo-detail' object.preventivo_id %}">Annulla</a>
    </form>
</div>
{% endblock %}
