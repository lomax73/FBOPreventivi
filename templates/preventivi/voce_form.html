{% extends 'base.html' %}

{% block title %}Voce — FBOPreventivi{% endblock %}

{% block content %}
<h1>{% if object %}Modifica voce{% else %}Nuova voce{% endif %}</h1>
<p style="color:#64748b;">Sezione {{ sezione.titolo }}</p>
<div class="card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Salva</button>
        <a class="btn btn-secondary" href="{% url 'preventivo-detail' sezione.preventivo_id %}">Annulla</a>
    </form>
</div>
{% endblock %}
