{% extends 'base.html' %}

{% block title %}Categoria — FBOPreventivi{% endblock %}

{% block content %}
<h1>{% if object %}Modifica categoria{% else %}Nuova categoria{% endif %}</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Salva</button>
        <a class="btn btn-secondary" href="{% url 'impostazioni' %}">Annulla</a>
    </form>
</div>
{% endblock %}
